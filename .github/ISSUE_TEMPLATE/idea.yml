name: "💡 Idea / Idée"
description: "Suggest something for the app · Proposer quelque chose pour l'appli"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Write in French or English. · Écrivez en français ou en anglais."
  - type: textarea
    id: need
    attributes:
      label: "What would you like to do? · Que voudriez-vous faire ?"
      description: "Describe the need first, then your idea. · Décrivez d'abord le besoin, puis votre idée."
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: "Anything else · Autre chose"
